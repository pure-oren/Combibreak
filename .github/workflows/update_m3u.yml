name: 🔁 Update PixelSports Playlist ⚽

on:
  schedule:
    - cron: '0 */12 * * *'  # at 00:00 and 12:00 UTC # runs every 12hour
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 🎯 Run PixelSports scraper
        run: python pixelsports.py

      - name: 💾 Commit & Push if Playlist Changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Add generated file
          git add Pixelsports.m3u8

          # Skip if no change
          if git diff --cached --quiet; then
            echo "✅ No changes detected — skipping commit."
            exit 0
          fi

          git commit -m "🔁 Auto-update PixelSports playlist ($(date -u +'%Y-%m-%d %H:%M UTC'))"

          # Random short delay to reduce push collisions
          sleep $((RANDOM % 10 + 5))

          # Push safely
          if ! git push origin main; then
            echo "⚠️ Push failed, attempting safe rebase..."
            git pull origin main --rebase || { echo "❌ Rebase failed."; exit 1; }
            git push origin main || { echo "❌ Push failed again."; exit 1; }
          fi
